name: Main

# Runs on merge to main: the full test suite (unit + integration) with the
# coverage gate, then a Docker image build as a deploy-readiness check.
# Integration tests only run here, not on every PR, to keep PR feedback fast
# and Actions usage low.
on:
  push:
    branches: [main]

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      # `-m "not e2e"` runs unit + integration against the in-memory sqlite
      # test settings. Coverage is measured on this combined run (the unit-only
      # number is misleadingly low because it omits the API tests).
      - name: Run tests with coverage gate
        run: uv run pytest -m "not e2e" --cov --cov-report=term-missing --cov-fail-under=60

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build-only (push: false) to verify the image builds. Add a registry
      # login + push:true here when you're ready to publish/deploy.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
