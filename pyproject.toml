[project]
name = "engineering-thesis-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.3",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "numpy>=2.4.4",
    "opencv-python>=4.11.0.86",
    "pillow>=12.2.0",
    "sahi>=0.11.36",
    "shapely>=2.1.2",
    "pyyaml>=6.0.3",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "ultralytics>=8.4.48",
    "easyocr>=1.7.2",
    "pandas>=3.0.3",
]

[tool.ruff]
line-length = 88
extend-exclude = ["*.ipynb", "**/migrations/*"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["ANN001", "ANN201"] # ANN001: function args, ANN201: return types

[dependency-groups]
dev = [
    "djlint>=1.36.4",
    "ruff>=0.15.7",
]

[tool.djlint]
profile = "django"
indent = 2
