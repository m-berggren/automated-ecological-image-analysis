upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Image batches can be large; do not cap the upload body size.
    client_max_body_size 0;

    # Django REST API and admin / browsable API.
    location ~ ^/(api|admin)/ {
        proxy_pass http://backend;
        # $http_host preserves the port (e.g. localhost:8080) so Django's
        # build_absolute_uri emits URLs the browser can actually reach. $host
        # would drop the port and yield http://localhost/... -> refused.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Django static (admin + DRF assets), populated by collectstatic.
    location /static/ {
        alias /vol/static/;
        access_log off;
        expires 1h;
    }

    # User-uploaded images and generated crops.
    location /media/ {
        alias /vol/media/;
        access_log off;
    }

    # SPA: serve built assets, fall back to index.html for client-side routes.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
